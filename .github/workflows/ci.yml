name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  # スタイルの検査
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: python -m pip install --upgrade clang-format cpplint
 
      - name: clang-format
        run: |
          $files = (Get-ChildItem -Recurse -Include *.h, *.cpp | Where-Object FullName -notmatch 'third_party').FullName
          clang-format --dry-run --Werror $files
 
      - name: cpplint (Google style)
        run: cpplint --recursive --exclude=third_party .

  # ビルド
  build:
    needs: lint
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v3
 
      - name: Build
        run: msbuild RondoEngine.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:RondoAudioBackend=Null
 
  # 静的解析
  analyze:
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v3
      - name: Code analysis
        run: msbuild RondoEngine.sln /m /p:Configuration=Release /p:Platform=x64 /p:RondoAudioBackend=Null /p:RunCodeAnalysis=true
 