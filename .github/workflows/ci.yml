name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  # 整形チェック
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: python -m pip install --upgrade clang-format
      - name: clang-format
        run: |
          $files = (Get-ChildItem -Recurse -Include *.h, *.cpp | Where-Object FullName -notmatch 'third_party').FullName
          clang-format --dry-run --Werror $files

  # スタイルチェック
  cpplint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cpplint
        run: python -m pip install --upgrade cpplint
      - name: cpplint
        run: cpplint --recursive --exclude=third_party .

  # ビルド
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
      - name: Build
        run: msbuild RondoEngine.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:RondoAudioBackend=Null

  # 静的解析
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
      - name: Code analysis
        run: msbuild RondoEngine.sln /m /p:Configuration=Release /p:Platform=x64 /p:RondoAudioBackend=Null /p:RunCodeAnalysis=true